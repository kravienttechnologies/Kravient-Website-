  <rect x="320" y="313" width="1169" height="173" rx="14" fill="#fff" stroke="#e1e5e1"/><text x="344" y="357" fill="#004b36" font-family="Arial" font-size="23" font-weight="900">जागतिक ग्राहक डेटाबेसशी शोध</text><text x="344" y="383" fill="#59615b" font-family="Arial" font-size="14">शोधा before adding KYC. If ग्राहक KYC already exists, जोडा it to your डॅशबोर्ड instead of creating a duplicate.</text><rect x="344" y="409" width="1022" height="36" rx="7" fill="#fff" stroke="#e1e5e1"/><text x="358" y="432" fill="#777" font-family="Arial" font-size="13">ग्राहकाचे नाव, मोबाईल किंवा ग्राहक कोडने शोधा</text><rect x="1376" y="409" width="88" height="36" rx="7" fill="#ffbd00"/><text x="1411" y="432" fill="#004b36" font-family="Arial" font-size="14" font-weight="800">शोधा</text>
