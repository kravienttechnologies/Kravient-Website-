  <rect x="320" y="198" width="382" height="92" rx="14" fill="#fff" stroke="#8eb2a5" stroke-width="2"/><rect x="341" y="219" width="47" height="48" rx="13" fill="#004b36"/><text x="404" y="236" fill="#777" font-family="Arial" font-size="12">एकूण कायमसी</text><text x="404" y="260" fill="#004b36" font-family="Arial" font-size="24" font-weight="900">1</text>
