<svg xmlns="http://www.w3.org/2000/svg" width="1525" height="735" viewBox="0 0 1525 735">
  <rect width="1525" height="735" fill="#f8faf8"/><rect width="288" height="735" fill="#004b36"/>
  <rect x="16" y="18" width="256" height="82" rx="18" fill="#145842" stroke="#236b55"/><circle cx="58" cy="59" r="28" fill="#f7fff7" stroke="#b9d7c6" stroke-width="3"/><text x="49" y="66" fill="#004b36" font-family="Arial" font-size="15" font-weight="800">ST</text><text x="98" y="52" fill="#fff" font-family="Arial" font-size="15" font-weight="800">शेखर तात्याबा कुंझीर</text><text x="98" y="72" fill="#bde0d0" font-family="Arial" font-size="12">सौम्य शेखर कुंझीर</text>
  <g font-family="Arial" font-size="15" font-weight="700"><text x="20" y="141" fill="#a8cdbd" font-size="12">नेव्हिगेशन</text><text x="54" y="186" fill="#d6eee3">डॅशबोर्ड</text><text x="54" y="232" fill="#d6eee3">सूचना</text><text x="54" y="276" fill="#d6eee3">ग्राहक पडताळणी</text><rect x="12" y="295" width="249" height="47" rx="12" fill="#ffbd00"/><text x="54" y="324" fill="#004b36">तक्रार नोंदवा</text><text x="54" y="367" fill="#d6eee3">माझ्या तक्रारी</text><text x="54" y="412" fill="#d6eee3">दैनिक बाजार भाव</text><text x="54" y="457" fill="#d6eee3">बाजार माहिती</text><text x="54" y="502" fill="#d6eee3">सूचना आणि कागदपत्रे</text><text x="54" y="548" fill="#d6eee3">माझे प्रोफाइल</text></g>
  <rect x="288" width="1237" height="82" fill="#fff"/><line x1="288" y1="82" x2="1525" y2="82" stroke="#e4e8e4"/><text x="312" y="31" fill="#777" font-family="Arial" font-size="12">सौम्य शेखर कुंझीर</text><text x="312" y="56" fill="#333" font-family="Arial" font-size="17" font-weight="800">पुन्हा स्वागत आहे, शेखर तात्याबा कुंझीर</text>
  <text x="320" y="139" fill="#004b36" font-family="Arial" font-size="28" font-weight="900">तक्रार नोंदवा</text><text x="320" y="166" fill="#59615b" font-family="Arial" font-size="14">सुविधेशी संबंधित समस्या, प्राधान्य, तपशील आणि पुरावे सबमिट करा.</text>
  <rect x="320" y="198" width="1169" height="49" rx="8" fill="#fff8df" stroke="#ffce55"/><text x="337" y="227" fill="#004b36" font-family="Arial" font-size="14" font-weight="700">सूचना: तक्रारी दररोज फक्त पहाटे 3:00 ते दुपारी 1:00 वाजेपर्यंत सबमिट करता येतील.</text>
  <rect x="320" y="267" width="1169" height="468" rx="14" fill="#fff" stroke="#e1e5e1"/>
  <text x="344" y="306" fill="#333" font-family="Arial" font-size="14" font-weight="700">तक्रार श्रेणी *</text><rect x="344" y="317" width="553" height="36" rx="7" fill="#fff" stroke="#ddd"/><text x="357" y="340" fill="#777" font-family="Arial" font-size="13">Select तक्रार श्रेणी</text>
  <text x="912" y="306" fill="#333" font-family="Arial" font-size="14" font-weight="700">प्राथम्य * / प्राथमिक *</text><rect x="912" y="317" width="552" height="36" rx="7" fill="#fff" stroke="#ddd"/><text x="925" y="340" fill="#777" font-family="Arial" font-size="13">Select प्राथम्य / प्राधान्य निवडा</text>
  <text x="344" y="382" fill="#333" font-family="Arial" font-size="14" font-weight="700">विषय *</text><rect x="344" y="393" width="1120" height="36" rx="7" fill="#fff" stroke="#ddd"/><text x="357" y="416" fill="#777" font-family="Arial" font-size="13">Short तक्रार title</text>
  <text x="344" y="458" fill="#333" font-family="Arial" font-size="14" font-weight="700">वर्णन *</text><rect x="344" y="468" width="1120" height="162" rx="7" fill="#fff" stroke="#ddd"/><text x="357" y="492" fill="#777" font-family="Arial" font-size="13">Describe the issue, location, आणि urgency clearly...</text>
  <rect x="344" y="646" width="553" height="89" rx="8" fill="#fbfffb" stroke="#b8d5ca" stroke-dasharray="6 5"/><text x="580" y="693" fill="#004b36" font-family="Arial" font-size="15" font-weight="800">प्रतिमा अपलोड करा</text>
  <rect x="912" y="646" width="552" height="89" rx="8" fill="#fbfffb" stroke="#b8d5ca" stroke-dasharray="6 5"/><text x="1145" y="693" fill="#004b36" font-family="Arial" font-size="15" font-weight="800">व्हिडिओ अपलोड करा</text>
</svg>
